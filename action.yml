name: pullrot
description: Find container image references that will fail to pull (removed Bitnami tags, k8s.gcr.io, deprecated images, anonymous Docker Hub pulls, missing tags)
author: Mohammad Hamarsheh
branding:
  icon: package
  color: red
inputs:
  path:
    description: "directory or files to scan"
    default: "."
  online:
    description: "HEAD every image against its registry (no pulls used)"
    default: "true"
  fail-on:
    description: "error, warn, info or never"
    default: "error"
  args:
    description: "extra arguments for 'pullrot scan', e.g. '--min-severity warn --mirror gcr'"
    default: ""
  python-version:
    default: "3.12"
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
    - shell: bash
      run: python -m pip install --quiet "${{ github.action_path }}"
    - shell: bash
      env:
        TARGET_PATH: ${{ inputs.path }}
        ONLINE: ${{ inputs.online }}
        FAIL_ON: ${{ inputs.fail-on }}
        ARGS: ${{ inputs.args }}
      run: |
        flags=""
        [ "$ONLINE" = "true" ] && flags="--online"
        pullrot scan "$TARGET_PATH" --format github --fail-on "$FAIL_ON" $flags $ARGS
