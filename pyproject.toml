[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pullrot"
version = "0.1.1"
description = "Find container image references that will fail to pull: removed Bitnami tags, frozen k8s.gcr.io, deprecated images, anonymous Docker Hub pulls in CI, and tags that no longer exist. Then fix them."
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Mohammad Hamarsheh" }]
keywords = ["docker", "containers", "bitnami", "kubernetes", "helm", "docker-compose", "ci", "rate-limit", "registry"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Build Tools",
  "Topic :: System :: Systems Administration",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/hamarshehmhmd/pullrot"
Issues = "https://github.com/hamarshehmhmd/pullrot/issues"

[project.scripts]
pullrot = "pullrot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
